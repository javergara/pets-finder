# Blueprint de Render para la API de Reencuentro (docs/deploy.md tiene la guía completa).
#
# La API necesita DISCO PERSISTENTE (ADR 0005): SQLite (data/app.db) y las fotos
# subidas (data/media/uploads/) viven en archivos — por eso no va en serverless.
# El disco se monta exactamente en el data/ del checkout del repo, que es donde
# reencuentro_api/media.py y models/base.py resuelven sus rutas por defecto.
services:
  - type: web
    name: reencuentro-api
    runtime: python
    rootDir: src/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn reencuentro_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.17
      # El checkout de Render vive en /opt/render/project/src (la raíz del repo).
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/data/app.db
      # El dominio real de Vercel, separado por comas si hay varios.
      - key: CORS_ORIGINS
        value: https://TU-PROYECTO.vercel.app
    disk:
      name: reencuentro-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
