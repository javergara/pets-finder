# Blueprint de Render para la API de Reencuentro (docs/deploy.md tiene la guía completa).
#
# La API es SIN ESTADO (ADR 0006): la base de datos vive en Supabase Postgres y
# las fotos en Supabase Storage — no se necesita disco persistente, así que el
# servicio funciona en el free tier de Render. Los valores sync:false se piden
# en el dashboard al crear el blueprint (vienen del proyecto de Supabase).
services:
  - type: web
    name: reencuentro-api
    runtime: python
    rootDir: src/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn reencuentro_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.17
      # Connection string del POOLER de Supabase (postgresql://...pooler.supabase.com:6543/...).
      - key: DATABASE_URL
        sync: false
      # https://TU-PROYECTO.supabase.co
      - key: SUPABASE_URL
        sync: false
      # service_role key (Settings → API). Solo vive en el backend, nunca en el frontend.
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: fotos
      # El dominio real de Vercel, separado por comas si hay varios.
      - key: CORS_ORIGINS
        sync: false
