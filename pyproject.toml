[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src/api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends(...) como default de argumento es el idiom de FastAPI

[tool.ruff.lint.per-file-ignores]
"scripts/seed.py" = ["E501"]  # historias de mascotas: datos, no lógica; no se envuelven

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests/api"]
