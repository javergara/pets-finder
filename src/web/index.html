<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v=3: los navegadores casi nunca revalidan el favicon — cada cambio de
         ícono necesita versionar la URL. v3 = isotipo oficial (design/logo/). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Finder Col — Mascotas perdidas y encontradas en Colombia</title>

    <!-- SEO + vista previa al compartir (WhatsApp/Instagram/Facebook leen esto
         del HTML estático; los links de /reporte/:id tienen su propia vista
         por reporte vía ADR 0009). URLs absolutas: los rastreadores no
         resuelven rutas relativas. -->
    <meta
      name="description"
      content="Reporta una mascota perdida o una que encontraste tras el sismo del Eje Cafetero y ayúdala a volver a casa. Mapa, coincidencias y contacto directo por WhatsApp. Armenia, Pereira, Manizales, Cali, Quibdó y Bogotá."
    />
    <link rel="canonical" href="https://petfinder-col.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pet Finder Col" />
    <meta property="og:title" content="Pet Finder Col — Ayudemos a cada mascota a volver a casa" />
    <meta
      property="og:description"
      content="Reporta una mascota perdida o una que encontraste tras el sismo del Eje Cafetero. Mapa, coincidencias y contacto directo por WhatsApp."
    />
    <meta property="og:url" content="https://petfinder-col.com/" />
    <meta property="og:image" content="https://petfinder-col.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pet Finder Col — mascotas perdidas y encontradas" />
    <meta property="og:locale" content="es_CO" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pet Finder Col — Ayudemos a cada mascota a volver a casa" />
    <meta
      name="twitter:description"
      content="Reporta una mascota perdida o una que encontraste tras el sismo del Eje Cafetero. Mapa, coincidencias y contacto directo por WhatsApp."
    />
    <meta name="twitter:image" content="https://petfinder-col.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
